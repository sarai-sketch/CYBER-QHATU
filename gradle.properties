# Project-wide Gradle settings.
# Configuración optimizada de memoria para estabilidad en Android Studio

# Límite de memoria para el demonio de Gradle
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8

# Límite de memoria para el demonio del compilador de Kotlin
kotlin.daemon.jvmargs=-Xmx1024m

# Desactivar configuration-cache para prevenir bloqueos en Windows al emular
org.gradle.configuration-cache=false

# Desactivar ejecución paralela masiva para ahorrar memoria RAM
org.gradle.parallel=false

# Estilo de código Kotlin y compatibilidad AGP
kotlin.code.style=official
android.disallowKotlinSourceSets=false